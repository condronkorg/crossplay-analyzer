name: Datadog Code Security

# Datadog Code Security rejects pull_request events. Use push for branch updates.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_SITE: us5.datadoghq.com
    steps:
      - uses: actions/checkout@v4
      - name: Explain missing credentials
        if: env.DD_API_KEY == '' || env.DD_APP_KEY == ''
        run: echo '::notice::Datadog SAST and SCA require DD_API_KEY and DD_APP_KEY repository secrets. Scans are skipped when secrets are unavailable, including fork pull requests.'
      - name: Datadog static analysis (SAST)
        if: env.DD_API_KEY != '' && env.DD_APP_KEY != ''
        uses: DataDog/datadog-static-analyzer-github-action@v3
        with:
          dd_api_key: ${{ secrets.DD_API_KEY }}
          dd_app_key: ${{ secrets.DD_APP_KEY }}
          dd_site: us5.datadoghq.com
      - name: Datadog Software Composition Analysis (SCA)
        if: ${{ !cancelled() && env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        uses: DataDog/datadog-sca-github-action@main
        with:
          dd_api_key: ${{ secrets.DD_API_KEY }}
          dd_app_key: ${{ secrets.DD_APP_KEY }}
          dd_site: us5.datadoghq.com
